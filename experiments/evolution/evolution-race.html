<title>進化レース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD pinned to corners; evolution cards rise from the bottom like a field guide */
:root {
  --deep: #061920;
  --ink: #e6f6f1;
  --muted: #8fb3ad;
  --dna: #7cf2c8;
  --sea: #3aa5c4;
  --land: #9ccc5a;
  --warn: #ffb35c;
  --panel: rgba(6, 25, 32, .74);
  --line: rgba(124, 242, 200, .3);
  --display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--deep); color: var(--ink); font-family: var(--body); }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; z-index: 2; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }

#rankBox { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; padding: 8px 14px; display: flex; align-items: baseline; gap: 12px; }
#rank { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--dna); }
#rank small { font-size: 16px; color: var(--muted); }
#time { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); }

#formBox { top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 16px; text-align: center; min-width: 200px; }
#era { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
#formName { font-family: var(--display); font-size: 22px; margin: 2px 0 6px; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 11px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar.sea i { background: var(--sea); }
.bar.land i { background: var(--land); }
#envTag { margin-top: 6px; font-size: 12px; }
#envTag b { font-weight: 700; }

#dnaBox { top: calc(12px + env(safe-area-inset-top, 0px)); right: 54px; padding: 8px 12px; width: 150px; }
#dnaLabel { font-size: 12px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
#dnaLabel b { color: var(--dna); }
#dnaBar { margin-top: 6px; height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
#dnaFill { height: 100%; width: 0; background: var(--dna); transition: width .2s; }

#course { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 24px; height: min(56vh, 360px); border-radius: 12px; overflow: visible;
  background: linear-gradient(to top, var(--sea) 0%, var(--sea) 41%, #c9b77a 41%, #c9b77a 46%, var(--land) 46%, var(--land) 100%); border: 1px solid var(--line); }
#course .goal { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: .1em; color: var(--ink); }
#course .dot { position: absolute; left: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, 50%); border: 2px solid var(--deep); }
#course .dot.me { width: 16px; height: 16px; border-color: var(--ink); z-index: 2; }

#toasts { left: 12px; top: calc(80px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; max-width: 46vw; }
.toast { padding: 6px 10px; font-size: 13px; animation: toastIn .25s ease-out; }
@keyframes toastIn { from { transform: translateX(-12px); opacity: 0; } }

#evo { left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); pointer-events: auto; text-align: center; width: min(560px, calc(100vw - 32px)); }
#evoHead { font-family: var(--display); color: var(--dna); font-size: 18px; margin-bottom: 8px; text-shadow: 0 0 12px rgba(124,242,200,.6); }
#evoHead small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); text-shadow: none; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { font: inherit; color: var(--ink); text-align: left; padding: 10px 12px; cursor: pointer; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; display: grid; gap: 4px; }
.card:hover, .card:focus-visible { border-color: var(--dna); outline: none; background: rgba(12, 48, 56, .85); }
.card .top { display: flex; align-items: center; gap: 8px; }
.card kbd { font-family: var(--display); font-size: 13px; background: var(--dna); color: var(--deep); border-radius: 5px; padding: 1px 7px; }
.card .nm { font-family: var(--display); font-size: 18px; }
.card .er { font-size: 11px; color: var(--muted); }
.card .tr { font-size: 12px; line-height: 1.5; color: var(--ink); }

.touch { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border-radius: 50%; z-index: 3; font-size: 28px; color: var(--ink);
  background: var(--panel); border: 1.5px solid var(--line); display: none; touch-action: none; user-select: none; -webkit-user-select: none; }
#tl { left: 16px; } #tr { right: 16px; }
@media (pointer: coarse) { .touch { display: block; } #evo { bottom: calc(108px + env(safe-area-inset-bottom, 0px)); } }

.overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(6,25,32,.55), rgba(6,25,32,.9)); }
.sheet { width: min(520px, 100%); padding: 24px; text-align: left; }
.sheet h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 46px); margin: 0 0 4px; line-height: 1.15; text-wrap: balance; }
.sheet h1 span { color: var(--dna); }
.sheet .sub { color: var(--muted); font-size: 13px; letter-spacing: .08em; margin-bottom: 16px; }
.sheet p, .sheet li { font-size: 14px; line-height: 1.7; }
.sheet ul { padding-left: 1.2em; margin: 8px 0 16px; }
.timeline { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 12px 0; }
.timeline b { color: var(--ink); font-weight: 700; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
.btn { font-family: var(--display); font-size: 18px; color: var(--deep); background: var(--dna); border: 0; border-radius: 10px; padding: 12px 28px; cursor: pointer; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.keys { font-size: 12px; color: var(--muted); margin-top: 12px; }
#count { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-size: 120px; color: var(--ink); text-shadow: 0 0 30px rgba(124,242,200,.7); }
table.res { width: 100%; border-collapse: collapse; margin: 8px 0 18px; font-size: 13px; }
table.res td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.res td.r { font-family: var(--display); font-size: 18px; width: 2.2em; }
table.res td.t { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.res .path { color: var(--muted); font-size: 11px; }
table.res tr.me td { color: var(--dna); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

@media (max-width: 560px) {
  #formBox { top: auto; bottom: calc(108px + env(safe-area-inset-bottom, 0px)); min-width: 0; padding: 6px 12px; }
  #formName { font-size: 18px; }
  #dnaBox { width: 110px; }
  #rank { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<div id="stage"></div>

<div class="hud panel" id="rankBox"><div id="rank">-<small>/4</small></div><div id="time">0.00秒</div></div>
<div class="hud panel" id="formBox">
  <div id="era">約38億年前</div>
  <div id="formName">単細胞</div>
  <div class="stats">
    <span>海</span><div class="bar sea"><i id="seaBar"></i></div>
    <span>陸</span><div class="bar land"><i id="landBar"></i></div>
  </div>
  <div id="envTag">いる場所：<b id="envName">海</b></div>
</div>
<div class="hud panel" id="dnaBox">
  <div id="dnaLabel"><span>DNA</span><span><b id="dnaNum">0</b> / <span id="dnaNeed">5</span></span></div>
  <div id="dnaBar"><div id="dnaFill"></div></div>
</div>
<div class="hud" id="course"><span class="goal">GOAL</span></div>
<div class="hud" id="toasts"></div>

<div class="hud" id="evo" hidden>
  <div id="evoHead">進化できます<small>いつ進化するかも作戦のうち。進化中は少し止まります</small></div>
  <div class="cards">
    <button class="card" id="evoA" data-i="0"></button>
    <button class="card" id="evoB" data-i="1"></button>
  </div>
</div>

<button class="touch" id="tl" aria-label="左へ">◀</button>
<button class="touch" id="tr" aria-label="右へ">▶</button>
<div id="count" hidden></div>

<div class="overlay" id="title">
  <div class="sheet panel">
    <h1>進化<span>レース</span></h1>
    <div class="sub">単細胞から、ゴールまで</div>
    <p>海の底から出発して、陸のゴールを目指します。光る <b style="color:var(--dna)">DNA</b> を集めると進化できます。</p>
    <div class="timeline"><b>単細胞</b>→<b>魚 / 両生類</b>→<b>走るトカゲ / カメ</b></div>
    <ul>
      <li>魚は海で速いが、陸ではほとんど進めない</li>
      <li>陸には岩がある。脚の速さを取るか、硬さを取るか</li>
      <li>CPU 3体と対戦します</li>
    </ul>
    <button class="btn" id="startBtn">スタート</button>
    <div class="keys">← → / A D で左右　1 / 2 で進化　スマホは画面下のボタン</div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet panel">
    <h1 id="resTitle">ゴール</h1>
    <div class="sub">進化の道すじ</div>
    <table class="res"><tbody id="resBody"></tbody></table>
    <button class="btn" id="retryBtn">もう一度</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const HALF = 13, WATER_END = -300, LAND_START = -330, GOAL = -720, SURFACE = 7, LAND_H = 8;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function groundH(z) {
  if (z > WATER_END) return 0;
  if (z < LAND_START) return LAND_H;
  const t = (WATER_END - z) / (WATER_END - LAND_START);
  return LAND_H * t * t * (3 - 2 * t);
}
function landness(z) { return clamp((groundH(z) - 5) / 3, 0, 1); }

const FORMS = {
  cell:   { name: '単細胞',     era: '約38億年前', water: 9,  land: 3,  h: .9,  trait: 'ふよふよ漂う。どこでも遅い' },
  fish:   { name: '魚',         era: '約5億年前',  water: 21, land: 4.5, h: .9, trait: 'ヒレで海を高速移動。陸ではほぼ動けない' },
  amph:   { name: '両生類',     era: '約3.7億年前', water: 14, land: 9.5, h: .45, trait: '肉厚のヒレで、海も陸もそこそこ' },
  runner: { name: '走るトカゲ', era: '約3億年前',  water: 8,  land: 24, h: 0,   trait: '長い脚で陸を爆走。岩にぶつかると転ぶ' },
  shell:  { name: 'カメ',       era: '約2.2億年前', water: 11, land: 16, h: .25, trait: '硬い甲羅で岩を押しのける。足はふつう' },
};
const EVO = [{ need: 5, opts: ['fish', 'amph'] }, { need: 12, opts: ['runner', 'shell'] }];

// ---------- three setup ----------
const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, .1, 400);
const SEA_C = new THREE.Color(0x0b4a5e), SKY_C = new THREE.Color(0xa8d8e8);
scene.background = SEA_C.clone();
scene.fog = new THREE.Fog(SEA_C.clone(), 10, 90);
scene.add(new THREE.HemisphereLight(0xdff6ff, 0x2a3a2a, .9));
const sun = new THREE.DirectionalLight(0xffffff, .8); sun.position.set(20, 50, 10); scene.add(sun);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7, flatShading: true }, o));

// ground strip with vertex colors
{
  const geo = new THREE.PlaneGeometry(90, 780, 30, 390);
  geo.rotateX(-Math.PI / 2); geo.translate(0, 0, 30 - 390);
  const pos = geo.attributes.position, cols = [];
  const sand = new THREE.Color(0xb8b083), seabed = new THREE.Color(0x4f8a83), grass = new THREE.Color(0x6fa548), path = new THREE.Color(0xa88c5a), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const off = Math.abs(x) > HALF + 2;
    pos.setY(i, groundH(z) + (off ? Math.sin(x * .7) * Math.cos(z * .3) * .6 + (Math.abs(x) - HALF) * .08 : 0));
    const L = landness(z), shore = clamp(1 - Math.abs(z + 315) / 25, 0, 1);
    c.copy(off ? seabed.clone().lerp(grass, L) : sand.clone().lerp(path, L));
    c.lerp(sand, shore * .7);
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
  const water = new THREE.Mesh(new THREE.PlaneGeometry(90, 360), new THREE.MeshStandardMaterial({ color: 0x3aa5c4, transparent: true, opacity: .45, side: THREE.DoubleSide, roughness: .2 }));
  water.rotation.x = -Math.PI / 2; water.position.set(0, SURFACE, 30 - 180); scene.add(water);
}

// decor
const sway = [];
function rnd(a, b) { return a + Math.random() * (b - a); }
function sideX() { return (Math.random() < .5 ? -1 : 1) * rnd(HALF + 3, 40); }
for (let i = 0; i < 90; i++) {
  const z = rnd(20, WATER_END + 10), x = sideX(), hgt = rnd(3, 8);
  const m = new THREE.Mesh(new THREE.ConeGeometry(rnd(.25, .5), hgt, 4), mat(Math.random() < .7 ? 0x2f8f5b : 0x7fbf4a));
  m.position.set(x, hgt / 2 + groundH(z), z); scene.add(m); sway.push({ m, p: Math.random() * 6 });
}
for (let i = 0; i < 30; i++) {
  const z = rnd(20, WATER_END), m = new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.6, 1.4), 0), mat([0xff7a8a, 0xffa94d, 0xc37bff][i % 3]));
  m.position.set(sideX(), .4, z); scene.add(m);
}
for (let i = 0; i < 80; i++) {
  const z = rnd(LAND_START - 5, GOAL - 30), x = sideX(), g = new THREE.Group(), s = rnd(.8, 1.6);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.25 * s, .35 * s, 2.5 * s, 5), mat(0x7a5634)); trunk.position.y = 1.25 * s;
  const top = new THREE.Mesh(i % 3 ? new THREE.ConeGeometry(1.6 * s, 4 * s, 6) : new THREE.IcosahedronGeometry(1.8 * s, 0), mat(i % 3 ? 0x3f7d3a : 0x5c9a3c));
  top.position.y = (i % 3 ? 4 : 3.6) * s; g.add(trunk, top); g.position.set(x, LAND_H, z); scene.add(g);
}
// goal arch
{
  const g = new THREE.Group(), pm = mat(0xe6f6f1);
  for (const sx of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pm); p.position.set(sx * (HALF + 1), 5, 0); g.add(p); }
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 64; const cx = cv.getContext('2d');
  for (let i = 0; i < 32; i++) for (let j = 0; j < 4; j++) { cx.fillStyle = (i + j) % 2 ? '#061920' : '#e6f6f1'; cx.fillRect(i * 16, j * 16, 16, 16); }
  cx.fillStyle = '#7cf2c8'; cx.fillRect(176, 8, 160, 48); cx.fillStyle = '#061920'; cx.font = 'bold 38px sans-serif'; cx.textAlign = 'center'; cx.fillText('GOAL', 256, 46);
  const banner = new THREE.Mesh(new THREE.BoxGeometry(2 * HALF + 3, 2.4, .4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) }));
  banner.position.y = 9.5; g.add(banner); g.position.set(0, LAND_H, GOAL); scene.add(g);
}
// bubbles
const BUB = 260, bubGeo = new THREE.BufferGeometry(), bubPos = new Float32Array(BUB * 3);
for (let i = 0; i < BUB; i++) { bubPos[i * 3] = rnd(-30, 30); bubPos[i * 3 + 1] = rnd(0, SURFACE); bubPos[i * 3 + 2] = rnd(-60, 20); }
bubGeo.setAttribute('position', new THREE.BufferAttribute(bubPos, 3));
const bubbles = new THREE.Points(bubGeo, new THREE.PointsMaterial({ color: 0xcff7ff, size: .18, transparent: true, opacity: .7 }));
scene.add(bubbles);

// ---------- creatures ----------
function eyes(g, x, y, z, s) {
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(s, 8, 6), mat(0xffffff)); e.position.set(sx * x, y, z); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(s * .55, 6, 5), mat(0x111111)); p.position.set(sx * (x + s * .15), y, z - s * .6); g.add(p);
  }
}
function leg(g, x, y, z, w, len, m) {
  const piv = new THREE.Group(); piv.position.set(x, y, z);
  const l = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), m); l.position.y = -len / 2; piv.add(l); g.add(piv); return piv;
}
function buildForm(kind, color) {
  const g = new THREE.Group(), c = new THREE.Color(color), dark = c.clone().multiplyScalar(.55), m = mat(c), md = mat(dark);
  let anim = () => {};
  if (kind === 'cell') {
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), mat(c, { transparent: true, opacity: .6, emissive: c, emissiveIntensity: .3 }));
    const nuc = new THREE.Mesh(new THREE.IcosahedronGeometry(.38, 1), md); nuc.position.set(.15, .1, -.1);
    g.add(body, nuc);
    anim = t => { const k = 1 + Math.sin(t * 6) * .09; body.scale.set(k, 1 / k, k); nuc.rotation.y = t; };
  } else if (kind === 'fish') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), m); body.scale.set(.7, .85, 1.7); g.add(body);
    const tail = new THREE.Group(); tail.position.z = 1.5; g.add(tail);
    const fin = new THREE.Mesh(new THREE.ConeGeometry(.8, 1.3, 3), md); fin.rotation.x = -Math.PI / 2; fin.scale.x = .25; fin.position.z = .55; tail.add(fin);
    const dor = new THREE.Mesh(new THREE.ConeGeometry(.35, .9, 3), md); dor.position.set(0, .9, .1); dor.scale.z = 2; g.add(dor);
    eyes(g, .42, .25, -1.2, .2);
    anim = (t, s) => { tail.rotation.y = Math.sin(t * (6 + s)) * .55; body.rotation.y = -tail.rotation.y * .15; };
  } else if (kind === 'amph') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), m); body.scale.set(.85, .55, 1.8); g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.65, 10, 7), m); head.scale.set(1, .65, 1.1); head.position.set(0, .1, -1.8); g.add(head);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.8, 5), md); tail.rotation.x = Math.PI / 2; tail.position.z = 2.4; g.add(tail);
    eyes(g, .35, .45, -2.1, .17);
    const legs = [[-.8, -.9], [.8, -.9], [-.8, .9], [.8, .9]].map(([x, z]) => leg(g, x, -.1, z, .25, .6, md));
    anim = (t, s) => { legs.forEach((l, i) => l.rotation.x = Math.sin(t * (4 + s * .8) + (i % 3 ? Math.PI : 0)) * .7); tail.rotation.y = Math.sin(t * 5) * .2; };
  } else if (kind === 'runner') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), m); body.scale.set(.6, .6, 1.4); body.position.y = 1.9; body.rotation.x = -.15; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.5, 10, 7), m); head.scale.set(.9, .8, 1.3); head.position.set(0, 2.5, -1.5); g.add(head);
    const tail = new THREE.Mesh(new THREE.ConeGeometry(.4, 2.6, 5), md); tail.rotation.x = Math.PI / 2 - .2; tail.position.set(0, 1.7, 2.4); g.add(tail);
    eyes(g, .3, 2.7, -1.85, .15);
    const L = leg(g, -.38, 1.6, .2, .22, 1.6, md), R = leg(g, .38, 1.6, .2, .22, 1.6, md);
    anim = (t, s) => { const a = Math.sin(t * (6 + s * .6)) * .9; L.rotation.x = a; R.rotation.x = -a; body.position.y = 1.9 + Math.abs(a) * .12; };
  } else if (kind === 'shell') {
    const sh = new THREE.Mesh(new THREE.SphereGeometry(1.25, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), md); sh.scale.set(1, .75, 1.25); sh.position.y = .35; g.add(sh);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, .2, 10), m); rim.scale.z = 1.25; rim.position.y = .35; g.add(rim);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.42, 8, 6), m); head.position.set(0, .45, -1.75); g.add(head);
    eyes(g, .22, .6, -2.05, .1);
    const legs = [[-.9, -.8], [.9, -.8], [-.9, .8], [.9, .8]].map(([x, z]) => leg(g, x, .35, z, .35, .45, m));
    anim = (t, s) => { legs.forEach((l, i) => l.rotation.x = Math.sin(t * (3 + s * .5) + (i % 3 ? Math.PI : 0)) * .5); head.position.z = -1.75 + Math.sin(t * 3) * .08; };
  }
  g.userData.anim = anim;
  return g;
}

// ---------- course objects ----------
let orbs = [], rocks = [];
const orbGeo = new THREE.OctahedronGeometry(.55, 0), ringGeo = new THREE.TorusGeometry(.85, .07, 6, 20);
const orbMat = new THREE.MeshStandardMaterial({ color: 0x7cf2c8, emissive: 0x7cf2c8, emissiveIntensity: .9 });
function makeCourse() {
  orbs.forEach(o => scene.remove(o.g)); rocks.forEach(r => scene.remove(r.m)); orbs = []; rocks = [];
  const addOrb = (z, x) => {
    const g = new THREE.Group(); g.add(new THREE.Mesh(orbGeo, orbMat));
    const ring = new THREE.Mesh(ringGeo, orbMat); g.add(ring);
    g.position.set(x, 0, z); scene.add(g); orbs.push({ g, ring, x, z, active: true, t: 0, ph: Math.random() * 6 });
  };
  for (let z = -25; z > WATER_END + 15; z -= 9) addOrb(z, rnd(-11, 11));
  for (let z = WATER_END - 5; z > -440; z -= 7) addOrb(z, rnd(-11, 11));
  for (let z = -460; z > GOAL + 20; z -= 26) addOrb(z, rnd(-11, 11));
  for (let i = 0; i < 46; i++) {
    const z = rnd(-350, GOAL + 15), s = rnd(.8, 1.5);
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2, 0), mat(0x8a8f96)); m.scale.set(s, s * rnd(.6, 1), s);
    const x = rnd(-12, 12); m.position.set(x, LAND_H + .4 * s, z); m.rotation.set(rnd(0, 3), rnd(0, 3), 0); scene.add(m);
    rocks.push({ m, x, z, r: 1.1 * s, id: i });
  }
}

// ---------- racers ----------
const ROSTER = [
  { name: 'あなた', color: 0x7cf2c8, css: '#7cf2c8', player: true },
  { name: 'アカ',     color: 0xff6b6b, css: '#ff6b6b', plan: ['fish', 'runner'], skill: .55, eager: false },
  { name: 'キイロ',   color: 0xffd25c, css: '#ffd25c', plan: ['amph', 'shell'], skill: .5, eager: false },
  { name: 'ムラサキ', color: 0xb98cff, css: '#b98cff', plan: null, skill: .85, eager: true },
];
let racers = [];
function setForm(r, kind) {
  if (r.mesh) scene.remove(r.mesh);
  r.form = kind; r.mesh = buildForm(kind, r.color); scene.add(r.mesh);
}
function makeRacers() {
  racers.forEach(r => scene.remove(r.mesh));
  racers = ROSTER.map((d, i) => {
    const plan = d.plan || [EVO[0].opts[Math.random() * 2 | 0], EVO[1].opts[Math.random() * 2 | 0]];
    const r = Object.assign({}, d, { plan, x: -7.5 + i * 5, z: 0, vx: 0, stage: 0, dna: 0, stun: 0, slow: 0, boost: 0, evolving: 0, hitCool: 0,
      finished: false, time: 0, path: ['cell'], lane: rnd(-8, 8), laneT: rnd(2, 5), avoid: new Map(), t: Math.random() * 5, mesh: null, input: 0 });
    setForm(r, 'cell'); return r;
  });
  const course = document.getElementById('course');
  course.querySelectorAll('.dot').forEach(d => d.remove());
  racers.forEach(r => { const d = document.createElement('div'); d.className = 'dot' + (r.player ? ' me' : ''); d.style.background = r.css; course.appendChild(d); r.dot = d; });
}

// ---------- effects ----------
const fx = [];
function burst(x, y, z, color, big) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(1, .12, 6, 28), new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.set(x, y, z); m.rotation.x = Math.PI / 2; scene.add(m); fx.push({ m, t: 0, dur: big ? .9 : .4, s: big ? 6 : 2.2 });
}
function updFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; const k = f.t / f.dur;
    f.m.scale.setScalar(1 + k * f.s); f.m.material.opacity = 1 - k;
    if (k >= 1) { scene.remove(f.m); fx.splice(i, 1); }
  }
}
function toast(html) {
  const el = document.createElement('div'); el.className = 'toast panel'; el.innerHTML = html;
  const box = document.getElementById('toasts'); box.prepend(el);
  while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => el.remove(), 2800);
}

function evolve(r, kind) {
  setForm(r, kind); r.stage++; r.path.push(kind); r.evolving = .7;
  burst(r.x, r.y + 1, r.z, r.color, true);
  if (!r.player) toast(`<span class="sw" style="background:${r.css}"></span>${r.name} が <b>${FORMS[kind].name}</b> に進化`);
  else { toast(`<b style="color:var(--dna)">${FORMS[kind].name}</b> に進化した！`); updEvoUI(); updFormUI(); }
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (state === 'race' && (e.key === '1' || e.key === '2')) choose(+e.key - 1);
  if (state === 'title' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const touch = { l: false, r: false };
for (const [id, k] of [['tl', 'l'], ['tr', 'r']]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); touch[k] = true; b.setPointerCapture(e.pointerId); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => { touch[k] = false; });
}
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => choose(+c.dataset.i)));
function choose(i) {
  const p = racers[0]; if (!p || p.stage > 1 || p.dna < EVO[p.stage].need || p.finished) return;
  evolve(p, EVO[p.stage].opts[i]);
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
function statBars(f) {
  const b = v => `<div class="bar"><i style="width:${v / 24 * 100}%"></i></div>`;
  return `<div class="stats"><span>海</span><div class="bar sea"><i style="width:${f.water / 24 * 100}%"></i></div><span>陸</span><div class="bar land"><i style="width:${f.land / 24 * 100}%"></i></div></div>`;
}
let evoShown = -1;
function updEvoUI() {
  const p = racers[0];
  const ready = state === 'race' && !p.finished && p.stage < 2 && p.dna >= EVO[p.stage].need;
  const key = ready ? p.stage : -1;
  if (key === evoShown) return; evoShown = key; $('evo').hidden = !ready;
  if (!ready) return;
  EVO[p.stage].opts.forEach((k, i) => {
    const f = FORMS[k];
    $(i ? 'evoB' : 'evoA').innerHTML = `<div class="top"><kbd>${i + 1}</kbd><span class="nm">${f.name}</span></div><div class="er">${f.era}</div>${statBars(f)}<div class="tr">${f.trait}</div>`;
  });
}
function updFormUI() {
  const p = racers[0], f = FORMS[p.form];
  $('formName').textContent = f.name; $('era').textContent = f.era;
  $('seaBar').style.width = f.water / 24 * 100 + '%'; $('landBar').style.width = f.land / 24 * 100 + '%';
}
let lastHud = '';
function updHud() {
  const p = racers[0];
  const order = [...racers].sort((a, b) => (a.finished && b.finished) ? a.time - b.time : a.finished ? -1 : b.finished ? 1 : a.z - b.z);
  const rank = order.indexOf(p) + 1;
  const need = p.stage < 2 ? EVO[p.stage].need : null;
  const L = landness(p.z), env = L <= 0 ? '海' : L >= 1 ? '陸' : '岸';
  const key = [rank, p.dna, p.stage, env].join('|');
  $('time').textContent = (p.finished ? p.time : raceT).toFixed(2) + '秒';
  if (key !== lastHud) {
    lastHud = key;
    $('rank').innerHTML = `${rank}<small>/4</small>`;
    $('dnaNum').textContent = p.dna; $('dnaNeed').textContent = need ?? '—';
    $('dnaFill').style.width = (need ? Math.min(1, p.dna / need) : 1) * 100 + '%';
    $('envName').textContent = env;
    $('envName').style.color = env === '海' ? 'var(--sea)' : env === '陸' ? 'var(--land)' : '#d8c78a';
  }
  for (const r of racers) r.dot.style.bottom = clamp(r.z / GOAL, 0, 1) * 100 + '%';
  updEvoUI();
}

// ---------- game loop ----------
let state = 'title', raceT = 0, countT = 0, endT = 0, clockT = 0;
function start() {
  makeCourse(); makeRacers(); updFormUI();
  $('title').hidden = true; $('result').hidden = true; $('toasts').innerHTML = '';
  state = 'count'; countT = 3.2; raceT = 0; endT = 0; evoShown = -2; lastHud = '';
  placeCam(true);
}
$('startBtn').onclick = start; $('retryBtn').onclick = start;

function npcThink(r, dt) {
  if (r.stage === 0 && r.dna >= EVO[0].need) evolve(r, r.plan[0]);
  else if (r.stage === 1 && r.dna >= EVO[1].need && (r.eager || r.z < -280 || r.form === 'amph')) evolve(r, r.plan[1]);
  r.laneT -= dt; if (r.laneT < 0) { r.lane = rnd(-9, 9); r.laneT = rnd(2, 5); }
  let tx = r.lane, best = 1e9;
  for (const o of orbs) {
    if (!o.active) continue; const dz = r.z - o.z; if (dz < 2 || dz > 32) continue;
    const dx = Math.abs(o.x - r.x); if (dx > 9) continue;
    const cost = dz * .35 + dx; if (cost < best) { best = cost; tx = o.x; }
  }
  if (r.form !== 'shell') for (const k of rocks) {
    const dz = r.z - k.z; if (dz < 0 || dz > 11) continue;
    const dx = k.x - r.x; if (Math.abs(dx) > k.r + 1.4) continue;
    if (!r.avoid.has(k.id)) r.avoid.set(k.id, Math.random() < r.skill);
    if (r.avoid.get(k.id)) { tx = r.x + (dx > 0 ? -4 : 4); break; }
  }
  r.input = clamp((tx - r.x) / 2.5, -1, 1);
}

function step(dt) {
  clockT += dt;
  if (state === 'count') {
    countT -= dt; const n = Math.ceil(countT - .2);
    $('count').hidden = false; $('count').textContent = n > 0 ? n : 'GO!';
    if (countT <= 0) { state = 'race'; $('count').hidden = true; }
  }
  if (state === 'race' || state === 'finish') {
    raceT += dt;
    const p = racers[0];
    if (!p.finished) p.input = ((keys['arrowright'] || keys['d'] || touch.r) ? 1 : 0) - ((keys['arrowleft'] || keys['a'] || touch.l) ? 1 : 0);
    for (const r of racers) {
      if (r.finished) { r.z -= 6 * dt; continue; }
      if (!r.player) npcThink(r, dt);
      const f = FORMS[r.form], L = landness(r.z);
      let sp = lerp(f.water, f.land, L);
      if (r.evolving > 0) { r.evolving -= dt; sp *= .15; }
      if (r.stun > 0) { r.stun -= dt; sp = 0; }
      if (r.slow > 0) { r.slow -= dt; sp *= .4; }
      if (r.boost > 0) { r.boost -= dt; sp *= 1.25; }
      if (!r.player) sp *= .97;
      r.vx += (r.input * 13 - r.vx) * Math.min(1, dt * 8);
      if (r.stun > 0) r.vx *= .5;
      r.x = clamp(r.x + r.vx * dt, -HALF, HALF);
      r.z -= sp * dt; r.sp = sp;
      r.hitCool -= dt;
      if (r.hitCool <= 0) for (const k of rocks) {
        if (Math.abs(k.z - r.z) > 3) continue;
        const dx = r.x - k.x, dz = r.z - k.z;
        if (dx * dx + dz * dz < (k.r + .9) ** 2) {
          r.hitCool = .9; r.x = clamp(r.x + (dx >= 0 ? 1.5 : -1.5), -HALF, HALF);
          if (r.form === 'runner') { r.stun = 1.1; if (r.player) toast('岩にぶつかって転んだ！'); }
          else if (r.form === 'shell') { r.slow = .15; }
          else { r.slow = .6; }
          burst(k.x, LAND_H + 1, k.z, 0xffb35c, false);
          break;
        }
      }
      for (const o of orbs) {
        if (!o.active) continue;
        if (Math.abs(o.z - r.z) < 1.6 && Math.abs(o.x - r.x) < 1.7) {
          o.active = false; o.t = 3; o.g.visible = false; r.dna++; r.boost = .35;
          if (r.player) burst(o.x, o.g.position.y, o.z, 0x7cf2c8, false);
        }
      }
      if (r.z <= GOAL) {
        r.finished = true; r.time = raceT;
        if (r.player) { state = 'finish'; endT = 0; $('evo').hidden = true; evoShown = -3; toast(`<b style="color:var(--dna)">ゴール！</b> ${raceT.toFixed(2)}秒`); }
      }
    }
    for (let i = 0; i < racers.length; i++) for (let j = i + 1; j < racers.length; j++) {
      const a = racers[i], b = racers[j], dx = a.x - b.x;
      if (Math.abs(a.z - b.z) < 1.6 && Math.abs(dx) < 1.8) { const push = (1.8 - Math.abs(dx)) / 2 * (dx >= 0 ? 1 : -1); a.x = clamp(a.x + push, -HALF, HALF); b.x = clamp(b.x - push, -HALF, HALF); }
    }
    if (state === 'finish') { endT += dt; if (endT > 7 || racers.every(r => r.finished)) showResult(); }
    updHud();
  }
  // animate racers
  for (const r of racers) {
    r.t += dt;
    const L = landness(r.z), f = FORMS[r.form];
    r.y = groundH(r.z) + f.h + (1 - L) * 1.6 + (r.form === 'cell' || r.form === 'fish' ? Math.sin(r.t * 2) * .2 : 0);
    r.mesh.position.set(r.x, r.y, r.z);
    r.mesh.rotation.y = r.stun > 0 ? r.t * 14 : -r.vx * .035;
    r.mesh.userData.anim(r.t, (r.sp || 0) * .5);
    const glow = r.evolving > 0 ? 1 + Math.sin(r.t * 40) * .15 : 1; r.mesh.scale.setScalar(glow);
  }
  for (const o of orbs) {
    if (!o.active) { o.t -= dt; if (o.t <= 0) { o.active = true; o.g.visible = true; } }
    o.g.position.y = groundH(o.z) + 1.3 + (1 - landness(o.z)) * 1.4 + Math.sin(clockT * 2 + o.ph) * .25;
    o.g.rotation.y = clockT * 2; o.ring.rotation.x = clockT * 1.5;
  }
  for (const s of sway) s.m.rotation.z = Math.sin(clockT * 1.2 + s.p) * .15;
  updFx(dt);
  placeCam(false, dt);
}

function placeCam(snap, dt = 1) {
  const p = racers[0]; if (!p) return;
  const tx = p.x * .6, ty = (p.y ?? 1) + 5, tz = p.z + 12;
  const k = snap ? 1 : Math.min(1, dt * 4);
  camera.position.x += (tx - camera.position.x) * k; camera.position.y += (ty - camera.position.y) * k; camera.position.z += (tz - camera.position.z) * k;
  camera.lookAt(p.x * .8, (p.y ?? 1) + 1.2, p.z - 12);
  const t = clamp((camera.position.y - (SURFACE - .5)) / 1.5, 0, 1) * (camera.position.z < LAND_START + 50 || camera.position.y > SURFACE ? 1 : 0);
  scene.background.copy(SEA_C).lerp(SKY_C, t); scene.fog.color.copy(scene.background);
  scene.fog.near = lerp(10, 50, t); scene.fog.far = lerp(90, 230, t);
  bubbles.visible = t < .5;
  if (bubbles.visible) {
    for (let i = 0; i < BUB; i++) {
      let y = bubPos[i * 3 + 1] + dt * .9; if (y > SURFACE) y = 0; bubPos[i * 3 + 1] = y;
      if (bubPos[i * 3 + 2] > camera.position.z + 5) bubPos[i * 3 + 2] -= 70;
      if (bubPos[i * 3 + 2] < camera.position.z - 65) bubPos[i * 3 + 2] += 70;
    }
    bubGeo.attributes.position.needsUpdate = true;
  }
}

function showResult() {
  state = 'done';
  const order = [...racers].sort((a, b) => (a.finished && b.finished) ? a.time - b.time : a.finished ? -1 : b.finished ? 1 : a.z - b.z);
  const rank = order.indexOf(racers[0]) + 1;
  $('resTitle').textContent = rank === 1 ? '1位でゴール！' : `${rank}位でゴール`;
  $('resBody').innerHTML = order.map((r, i) => `<tr class="${r.player ? 'me' : ''}"><td class="r">${i + 1}</td><td><span class="sw" style="background:${r.css}"></span>${r.name}<div class="path">${r.path.map(k => FORMS[k].name).join(' → ')}</div></td><td class="t">${r.finished ? r.time.toFixed(2) + '秒' : '進化中…'}</td></tr>`).join('');
  $('result').hidden = false; $('retryBtn').focus();
}

// idle preview behind title
makeCourse(); makeRacers(); updFormUI(); placeCam(true);
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
